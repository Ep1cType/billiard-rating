<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Турниры — Бильярдный рейтинг</title>
<meta name="description" content="Список всех сыгранных бильярдных турниров.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&amp;family=PT+Sans:wght@400;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a href="index.html" class="brand">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="url(#ballGradT)"/>
        <circle cx="11" cy="11" r="3.2" fill="#fff" opacity="0.55"/>
        <defs>
          <radialGradient id="ballGradT" cx="0.35" cy="0.3" r="0.8">
            <stop offset="0%" stop-color="#eccb63"/>
            <stop offset="100%" stop-color="#9c7a1f"/>
          </radialGradient>
        </defs>
      </svg>
      Бильярдный рейтинг
    </a>
    <nav class="site-nav" aria-label="Основная навигация">
      <a href="index.html">Рейтинг</a>
      <a href="tournaments.html" class="active">Турниры</a>
      <a href="admin.html">Админ</a>
    </nav>
  </div>
</header>

<main>
  <div class="container">

    <div class="section-title">
      <h2 style="font-size:1.8rem;">Турниры</h2>
    </div>

    <div id="loading" class="loading-row"><span class="spinner"></span>&nbsp; Загружаем турниры…</div>
    <div id="error-banner" class="banner banner-error" hidden></div>

    <div id="list" class="stack"></div>

    <div id="empty-state" class="empty-state" hidden>
      <h3>Турниров пока нет</h3>
      <p>Здесь появится список турниров, как только администратор добавит первый.</p>
    </div>

  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <p>Рейтинг считается по 12 лучшим результатам каждого игрока</p>
  </div>
</footer>

<script type="module" src="js/tournaments.js"></script>
</body>
</html>
